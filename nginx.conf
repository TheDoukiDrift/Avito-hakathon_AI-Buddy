# SPA + прокси на backend. Используется в frontend-образе (nginx:alpine).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие статики
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Статика с хешем в имени — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API → backend (SSE-friendly: без буферизации и без таймаута на стрим)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA-фолбэк: любой маршрут отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
