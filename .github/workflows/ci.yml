name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, coverage ≥80%)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avito
          POSTGRES_PASSWORD: avito
          POSTGRES_DB: ai_buddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avito -d ai_buddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
      POSTGRES_DB: ai_buddy
      DATABASE_URL: postgresql+psycopg://avito:avito@localhost:5432/ai_buddy
      REDIS_URL: redis://localhost:6379/0
      MCP_SERVER_URL: http://localhost:8001
      # пусто = FakeLLM, внешний ключ в CI не нужен
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: qwen2.5-72b-instruct

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint + format)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: ignore

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из package.json -> packageManager (pnpm@12.18.0),
      # чтобы CI и Dockerfile (corepack) не расходились.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm coverage

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
