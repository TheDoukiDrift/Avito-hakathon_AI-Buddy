# AI-buddy — локальный стек целиком: docker compose up --build
# Секреты берутся из .env (шаблон — .env.example), в репозитории их нет.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito}
      POSTGRES_DB: ${POSTGRES_DB:-ai_buddy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # только локально: БД не должна светиться в сеть
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avito} -d ${POSTGRES_DB:-ai_buddy}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    # CMD образа (uvicorn app.main:app) — entrypoint уже задан в Dockerfile,
    # повторный `command: entrypoint.sh` уводил процесс в бесконечный рекурсивный exec.
    env_file:
      - .env
    environment:
      # внутри compose БД и Redis живут по именам сервисов
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://avito:avito@postgres:5432/ai_buddy}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # пусто = временный ключ процесса (см. .env.example)
      SECRET_KEY: ${SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      # no curl in python:3.12-slim — probe the API with the interpreter itself
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MCP-сервер инструментов — отдельный процесс из того же образа.
  # Своя точка входа: ждёт БД и стартует сервер, без миграций и сидов
  # (иначе два alembic upgrade head гоняются на пустой базе).
  mcp:
    build:
      context: ./backend
    entrypoint: ["/app/mcp_entrypoint.sh"]
    command: ["python", "-m", "mcp_server"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://avito:avito@postgres:5432/ai_buddy}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
    # порт не публикуем: инструменты доступны только backend'у по имени сервиса
    restart: unless-stopped
    healthcheck:
      # /mcp speaks streamable-http (POST + session), so probe the TCP port
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8001), 3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

  # Одноразовый прогон фронтенд-тестов (`make test`). Runtime-образ frontend —
  # это nginx, node в нём нет, поэтому тесты идут в стадии сборки Dockerfile:
  # там уже установлены зависимости из pnpm-lock.yaml.
  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    working_dir: /app
    command: ["pnpm", "coverage"]

volumes:
  pgdata:
